name: Refresh profile stats

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: assets/github-stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true
          options: username=harshelke180502&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true&show=reviews,prs_merged,prs_merged_percentage

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: assets/github-top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true
          options: username=harshelke180502&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&count_private=true

      - name: Commit updated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GitHub profile stats"
          file_pattern: assets/github-stats.svg assets/github-top-langs.svg
